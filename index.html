.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.p-ok{color:var(--ok);background:var(--ok-bg)}.p-warn{color:var(--warn);background:var(--warn-bg)}.p-bad{color:var(--bad);background:var(--bad-bg)}.p-rep{color:var(--ink);background:var(--bg)}.p-on{color:var(--blue);background:var(--blue-bg)}.p-acc{background:var(--acc);color:var(--ink)}

.av{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);overflow:hidden;background-size:cover;background-position:center}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe));width:calc(100% - 32px);max-width:528px;height:var(--nav);background:var(--ink);border-radius:24px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px;gap:4px;box-shadow:0 10px 30px rgba(17,19,23,.25);z-index:20}
.nav button{border-radius:18px;color:#A3A8B3;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nav button.on{background:var(--acc);color:var(--ink);font-weight:800}
.nav .badge{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:#E8590C;color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}

.wd.on{background:var(--ink);color:#fff}.wd.on .c{background:var(--acc)}
.wd.dim{background:transparent;color:var(--soft)}.wd.dim .c{background:transparent;color:var(--soft)}

.hrow{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.hrow .tm{width:52px;flex-shrink:0;font-size:14px;font-weight:800}
.slot{flex:1;min-width:0;min-height:50px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;font-size:14px;font-weight:700;background:#fff;text-align:left;gap:8px}
.slot .plus{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.slot.busy{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--soft);font-weight:600;font-size:13px;cursor:default}
.slot.past{background:transparent;color:var(--soft);font-weight:600;font-size:13px;cursor:default}
.slot.sel{background:var(--ink);color:#fff;font-weight:800}

.slot.mine{background:var(--acc);color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 2px var(--ink)}

const TZ = () => (S.me && S.me.trainer && S.me.trainer.tz) || 'Europe/Kyiv';

const fday = (iso, o) => new Intl.DateTimeFormat(LOC(), { timeZone: 'UTC', ...o }).format(new Date(iso + 'T00:00:00Z'));

const CNAV = [['home', 'home', 'n_today'], ['book', 'cal', 'n_book'], ['progress', 'chart', 'n_progress'], ['notes', 'note', 'n_notes']];
const TNAV = [['day', 'cal', 'n_schedule'], ['clients', 'users', 'n_clients'], ['pay', 'wallet', 'n_pay'], ['more', 'more', 'n_more']];
function route() {
  let h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = h.match(/^(\w+)[=/](.+)$/);
  return m ? { name: m[1], arg: m[2] } : { name: h || '', arg: null };
}
function go(h) { if (location.hash === '#' + h) render(); else location.hash = h; }
function navHtml(active) {
  const items = S.role === 'trainer' ? TNAV : CNAV;
  const badge = S.role === 'trainer' && S.payBadge ? `<span class="badge">${S.payBadge}</span>` : '';
  return `<nav class="nav" aria-label="menu">${items.map(([r, i, k]) => `<button class="${r === active ? 'on' : ''}" data-a="go" data-r="${r}" aria-current="${r === active ? 'page' : 'false'}">${ic(i, 20, 'currentColor', r === active ? 2.2 : 2)}${t(k)}${r === 'pay' ? badge : ''}</button>`).join('')}</nav>`;
}
const SUB = ['client', 'cnotes', 'complaint', 'rec', 'settings'];
function setBack(on) { safe(() => { if (on) TG.BackButton.show(); else TG.BackButton.hide(); }); }

async function render() {
  const r = route();
  if (!S.me) return;
  if (S.role === 'new') { app().innerHTML = viewOnboard(); return; }
  const def = S.role === 'trainer' ? 'day' : 'home';
  const name = r.name || def;
  const views = S.role === 'trainer'
    ? { day: viewDay, week: viewDay, clients: viewClients, client: viewClient, cnotes: viewNotes, pay: viewPay, more: viewMore }
    : { home: viewHome, book: viewBook, rec: viewRec, progress: viewProgress, notes: viewNotes, complaint: viewComplaint };
  const fn = views[name] || views[def];
  setBack(SUB.includes(name));
  const navKey = { week: 'day', client: 'clients', cnotes: 'clients', rec: 'book', complaint: 'home' }[name] || name;
  const seq = (S.seq = (S.seq || 0) + 1);
  if (!app().dataset.v || app().dataset.v !== name) app().innerHTML = skeleton();
  app().dataset.v = name;
  try {
    const html = await fn(r.arg);
    if (seq !== S.seq) return;
    app().innerHTML = html;
    app().classList.toggle('no-nav', !!document.querySelector('#app .hide-nav'));
    let nav = document.getElementById('nav-root');
    if (!nav) { nav = document.createElement('div'); nav.id = 'nav-root'; document.body.appendChild(nav); }
    nav.innerHTML = navHtml(navKey) + miniHtml();
    if (S.afterRender) { const f = S.afterRender; S.afterRender = null; f(); }
  } catch (e) {
    if (seq !== S.seq) return;
    app().innerHTML = `<div class="empty">${t('err_load')}<br><br><button class="btn sm" data-a="reload">${t('retry')}</button></div>`;
    console.log(e);
  }
}
const skeleton = () => '<div class="skel" style="height:44px;width:60%;margin-bottom:16px"></div><div class="skel" style="height:220px"></div><div class="skel" style="height:140px;margin-top:10px"></div>';

// ───────── данные с кэшем ─────────
async function load(key, fn, maxAge = 15000) {
  const c = S.cache[key];
  if (c && Date.now() - c.t < maxAge) return c.v;
  const v = await fn();
  S.cache[key] = { v, t: Date.now() };
  return v;
}
const drop = (...prefixes) => { for (const k of Object.keys(S.cache)) if (prefixes.some((p) => k.startsWith(p))) delete S.cache[k]; };

function spark(vals, w, h, color = 'var(--ink)') {
  if (vals.length < 2) return `<svg width="100%" height="${h}" aria-hidden="true"></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${4 + (1 - (v - mn) / sp) * (h - 8)}`).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function chart(pts) {
  const W = 326, H = 150;
  if (pts.length < 2) return `<div class="empty" style="padding:30px 0">${t('chart_empty')}</div>`;
  const vals = pts.map((p) => p[1]); let mn = Math.min(...vals), mx = Math.max(...vals); if (mx - mn < 1) { mn -= 0.5; mx += 0.5; }
  const x = (i) => 8 + (i / (pts.length - 1)) * (W - 16), y = (v) => 14 + (1 - (v - mn) / (mx - mn)) * (H - 40);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const lab = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chart_label')}">
    ${[14, (H - 26 + 14) / 2, H - 26].map((yy) => `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="#EEF0F2"/>`).join('')}
    <polygon points="${x(0)},${H - 22} ${line} ${x(pts.length - 1)},${H - 22}" fill="var(--acc)" opacity=".35"/>
    <polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(vals[vals.length - 1])}" r="7" fill="var(--acc)" stroke="var(--ink)" stroke-width="3"/>
    ${lab.map((i) => `<text x="${Math.min(W - 40, Math.max(0, x(i) - 14))}" y="${H - 4}" font-size="10" font-weight="600" fill="#5D636E">${esc(fday(pts[i][0], { day: 'numeric', month: 'short' }))}</text>`).join('')}</svg>`;
}

function weekGrid(W, ws) {
  const all = W.flatMap((d) => d.items);

  const cols = W.map((d) => {
    let inner = '';
    const covered = new Set();
    for (const it of d.items) {

      for (let h = Math.floor(st / 60); h < Math.ceil((st + len) / 60); h++) covered.add(h);

    <div class="wgrid"><div style="position:relative;height:${H}px">${Array.from({ length: h1 - h0 - 1 }, (_, i) => `<span style="position:absolute;top:${(i + 1) * ROW - 6}px;right:4px;font-size:10px;font-weight:600;color:var(--muted)">${h0 + i + 1}</span>`).join('')}</div>${cols}</div></div>
    <div class="row gap12 mt8 small muted b" style="justify-content:center;flex-wrap:wrap"><span class="row gap4"><span style="width:10px;height:10px;border-radius:3px;background:var(--ink)"></span>${t('personal_s')}</span><span class="row gap4"><span style="width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:inset 0 0 0 1px var(--ink)"></span>${t('group')}</span><span class="row gap4"><span style="width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--soft)"></span>${t('free')}</span><span class="row gap4"><span style="width:7px;height:7px;border-radius:50%;background:var(--dot)"></span>${t('online_s')}</span></div>`;
}

// ── клиенты
async function viewClients() {
  const L = await load('clients', () => call('clients'));
  const me = S.me;
  const stale = (c) => (c.last ? Date.now() - c.last > 14 * 86400000 : Date.now() - c.since > 14 * 86400000) && !c.next;
  const pkgFlag = (c) => c.claimed || c.unpaid || (c.left != null && c.left <= 1) || (c.left == null && c.next);
  const attention = (c) => c.complaint || pkgFlag(c) || stale(c);
  const F = { all: () => true, cmp: (c) => c.complaint, pkg: pkgFlag, stale };
  const q = S.q.trim().toLowerCase();
  const list = L.filter((c) => F[S.cf](c) && (!q || (c.name + ' ' + (c.username || '')).toLowerCase().includes(q)));
  const row = (c) => {
    const pills = [];
    if (c.complaint) pills.push(`<span class="pill p-bad">${t('complaint_s')}</span>`);
    if (c.claimed) pills.push(`<span class="pill p-warn">${t('paid_check')}</span>`);
    else if (c.left != null && c.left <= 1) pills.push(`<span class="pill p-warn">${t('renew')}</span>`);
    else if (stale(c)) pills.push(`<span class="pill p-rep">${t('call_back')}</span>`);
    const sub = [c.left == null ? t('no_pkg') : t('left_n', c.left), c.next ? whenStr(c.next) : c.last ? t('last_visit', fday(dkey(c.last), { day: 'numeric', month: 'short' })) : ''].filter(Boolean).join(' · ');
    return `<button class="lrow" data-a="go" data-r="client/${c.id}">${av(c, 44)}<span class="col grow gap4" style="min-width:0"><span class="s14 b ellip" style="font-size:15px">${esc(c.name)}${c.series ? ' <span class="muted" style="font-weight:600">↻</span>' : ''}</span><span class="small muted sb ellip">${sub}</span></span>${pills.join('')}${ic('right', 16, 'var(--soft)', 2.4)}</button>`;
  };
  let out = `<div class="top"><span class="h1">${t('n_clients')}</span><button class="btn sm" style="height:44px;border-radius:14px" data-a="invite">${ic('link', 16, 'var(--acc)', 2.2)}${t('invite')}</button></div>
    <label class="row gap8" style="height:46px;border-radius:14px;background:#fff;padding:0 14px;margin-bottom:10px">${ic('search', 18, 'var(--muted)')}<span class="hidden">${t('search')}</span><input class="grow" data-in="q" value="${esc(S.q)}" placeholder="${t('search_ph')}" style="border:none;outline:none;background:transparent;font-size:15px;height:44px"></label>
    <div class="chips mb12">${[['all', t('f_all') + ' · ' + L.length], ['cmp', t('f_complaint') + ' · ' + L.filter(F.cmp).length], ['pkg', t('f_pkg') + ' · ' + L.filter(F.pkg).length], ['stale', t('f_stale') + ' · ' + L.filter(F.stale).length]].map(([k, l]) => `<button class="chip ${S.cf === k ? 'on' : ''}" data-a="cf" data-k="${k}">${l}</button>`).join('')}</div>`;
  if (!L.length) return out + `<div class="card col gap8 center" style="padding:24px"><span class="h2">${t('no_clients_title')}</span><span class="s14 muted" style="line-height:1.45">${t('no_clients_sub')}</span><button class="btn acc mt8" data-a="invite">${ic('share', 16)}${t('send_invite')}</button></div>`;
  const att = S.cf === 'all' && !q ? list.filter(attention) : [];
  if (att.length) out += `<span class="lbl" style="margin-top:4px">${t('attention')}</span>` + att.map(row).join('') + `<span class="lbl">${t('all_clients')}</span>`;
  out += list.map(row).join('') || `<div class="empty">${t('nothing_found')}</div>`;
  return out;
}

}

}

    document.querySelectorAll('[data-in="set"]').forEach((i) => { f[i.dataset.k] = i.value; });
    const r = await call('settings_set', { f });
    S.cache.settings = { v: { ...r, link: S.set.link }, t: Date.now() }; S.me.trainer = { ...S.me.trainer, ...r }; S.setf = null; S.hours = null;
    hap('success'); toast(t('saved')); drop('tdays'); render();
  }),
};
function redrawPk() { const pr = document.getElementById('pk-price').value; document.getElementById('sheet').innerHTML = '<div class="grab"></div>' + S.pkDraw(); document.getElementById('pk-price').value = pr; }
function syncPlan() {
  const sh = document.getElementById('sheet'); if (!sh) return;
  sh.querySelectorAll('[data-in]').forEach((el) => {
    const i = Number(el.dataset.i);
    if (el.dataset.in === 'pt') S.pe.title = el.value; else if (el.dataset.in === 'pnote') S.pe.note = el.value;
    else if (el.dataset.in === 'pn') S.pe.items[i].n = el.value; else if (el.dataset.in === 'ps') S.pe.items[i].s = el.value;
  });
}
// локальное время тренера → миллисекунды
function zonedTs(y, mo, d, h, mi, tz) {
  const guess = Date.UTC(y, mo - 1, d, h, mi);
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(guess));
  const g = Object.fromEntries(parts.map((p) => [p.type, p.value]));
  const asTz = Date.UTC(Number(g.year), Number(g.month) - 1, Number(g.day), Number(g.hour) % 24, Number(g.minute));
  return guess - (asTz - guess);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.a];
  if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.in === 'rectime') { S.rec.times[Number(el.dataset.d)] = el.value; recPreview(); }
  if (el.dataset.in === 'hf') S.hours[Number(el.dataset.i)].from = el.value;
  if (el.dataset.in === 'ht') S.hours[Number(el.dataset.i)].to = el.value;
});
let qTimer = null;
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.in === 'q') { S.q = el.value; clearTimeout(qTimer); qTimer = setTimeout(() => { render().then(() => { const i = document.querySelector('[data-in="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 250); }
  if (el.id === 'note-in') { el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; }
});
window.addEventListener('hashchange', () => { closeSheet(true); render(); window.scrollTo(0, 0); });

// ───────── старт ─────────
async function start(me) {
  S.me = me; S.role = me.role; S.lang = me.lang || 'ru';
  document.documentElement.lang = S.lang;
  if (me.role === 'trainer') safe(() => call('payments').then((p) => { S.cache.payments = { v: p, t: Date.now() }; S.payBadge = (p.items || []).filter((x) => x.claimed && !x.paid).length; const n = document.getElementById('nav-root'); if (n) n.innerHTML = navHtml(route().name === 'pay' ? 'pay' : ({ week: 'day', client: 'clients', cnotes: 'clients' }[route().name] || route().name || 'day')) + miniHtml(); }));
  await render();
}
async function boot() {
  safe(() => { TG.ready(); TG.expand(); TG.setHeaderColor('#F2F3F5'); TG.setBackgroundColor('#F2F3F5'); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); });
  safe(() => TG.BackButton.onClick(() => { if (S.sheetOpen) return closeSheet(); const r = route(); go(r.name === 'cnotes' ? 'client/' + r.arg : S.role === 'trainer' ? (r.name === 'client' ? 'clients' : 'day') : r.name === 'rec' ? 'book' : 'home'); }));
  S.lang = /^uk/.test(safe(() => TG.initDataUnsafe.user.language_code, '') || navigator.language || '') ? 'uk' : 'ru';
  if (!CFG.api || !INIT) { app().innerHTML = `<div class="empty" style="padding-top:80px"><div class="h2">${t('open_in_tg')}</div><p>${t('open_in_tg_sub')}</p></div>`; return; }
  app().innerHTML = skeleton();
  try {
    const r = await call('me');
    if (r.home) S.cache.home = { v: r.home, t: Date.now() };
    await start(r.me);
  } catch (e) {
    app().innerHTML = `<div class="empty" style="padding-top:80px">${e.code === 'auth' ? t('err_auth') : t('err_load')}<br><br><button class="btn sm" onclick="location.reload()">${t('retry')}</button></div>`;
  }
  setInterval(() => { if (document.visibilityState === 'visible' && !S.sheetOpen && !document.activeElement.matches('input,textarea,select')) { S.cache = Object.fromEntries(Object.entries(S.cache).filter(([k]) => k === 'settings')); render(); } }, 45000);
}
boot();
